<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuidado Diário</title>
<meta name="theme-color" content="#F6E7B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuidado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: crayon-painted backdrop (canvas), paper cards with wobbly pastel outlines, fixed bottom tab bar */
:root{
  /* single committed look: burnt-yellow ground, colour-block habit cards (cut-paper palette) */
  --bg:#F6E7B4; --paper:#FFFAEC; --paper-2:#EEDB9E; --ink:#422F0E; --muted:#7A6542; --edge:#422F0E;
  --sky:#037F71; --pink:#EA5E86; --orange:#AECFD0; --green:#DDF2B8; --yellow:#FFD094; --violet:#F9D4F8; --blue:#57B1A8; --lilac:#F9D4F8; --chart:#DDF2B8; --twilight:#AECFD0; --shortcake:#FCC4C0; --corn:#F7E9B2;
  --on:#FDF6E3; --cream:#FDF6E3;
  --p-base:#D8961F; --p-a:#D8961F; --p-b:#D8961F; --p-c:#D8961F; --p-d:#D8961F; --p-mode:v;
  color-scheme:light;
  --display:"Bricolage Grotesque","Avenir Next Condensed",system-ui,sans-serif;
  --body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-weight:600;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.02;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* paper card with crayon outline */
.paper{position:relative;background:var(--paper);background-image:var(--grain);border-radius:22px;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent),0 10px 30px -12px rgba(10,30,40,.35)}

/* header */
.dayhead{display:flex;align-items:center;gap:10px;padding:6px 0 4px}
.dayhead .t{flex:1;min-width:0;text-align:center}
.dayhead h1{font-size:40px;color:var(--ink);text-transform:capitalize}
.dayhead .sub{font-weight:700;font-size:14px;color:var(--ink);opacity:.85}
.dayhead .sub::first-letter{text-transform:uppercase}
.round{width:46px;height:46px;border-radius:50%;background:var(--paper);box-shadow:0 4px 14px -6px rgba(10,30,40,.4);display:grid;place-items:center;flex:none;position:relative}
.round svg{width:22px;height:22px}
.round:disabled{opacity:.35;cursor:default}

.hero{margin-top:12px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.hero .meter{flex:none;width:68px;height:68px;position:relative}
.hero .meter svg{width:68px;height:68px;transform:rotate(-90deg)}
.hero .meter b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:800}
.hero p{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.hero p small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:4px}
.hero.done{background-color:var(--yellow);color:#1A2142}
.hero.done p small{color:#1A2142;opacity:.75}
.banner{margin-top:10px;font-size:13px;font-weight:800;display:inline-flex;gap:8px;align-items:center;background:var(--paper);padding:6px 12px;border-radius:999px}
.banner i{width:8px;height:8px;border-radius:50%;background:var(--orange)}

.list{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.card{--hc:var(--pink);padding:16px 16px 18px}
.card .head{display:flex;align-items:center;gap:10px}
.badge{width:42px;height:42px;border-radius:13px;background:var(--hc);color:var(--on);display:grid;place-items:center;flex:none}
.badge svg{width:24px;height:24px}
.card .head .nm{flex:1;min-width:0}
.card h3{font-size:22px;color:var(--ink)}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--hc)}
.streak svg{width:14px;height:14px}
.streak.zero{color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:38px;line-height:1;color:var(--hc)}
.big small{font-family:var(--body);font-size:15px;font-weight:800;color:var(--muted)}
.done-tag{display:inline-flex;align-items:center;gap:4px;background:var(--hc);color:var(--on);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.done-tag svg{width:14px;height:14px}

/* water */
.water{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;margin-top:10px}
.glass{width:104px;height:136px;display:block}
.water>button:disabled{cursor:default}
.glass .wv{animation:wave 3.2s linear infinite}
.glass .wv2{animation:wave 5s linear infinite reverse;opacity:.55}
.glass .lvl{transition:transform 1.6s cubic-bezier(.3,1.25,.5,1)}
@keyframes wave{to{transform:translateX(-100px)}}
.water .side{min-width:0;display:flex;flex-direction:column;gap:10px}
.water .left{font-size:14px;font-weight:800;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{min-height:50px;padding:0 18px;border-radius:14px;background:var(--hc);color:var(--on);font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 color-mix(in srgb,var(--hc) 55%,#000);transition:transform .08s}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--hc) 55%,#000)}
.cbtn svg{width:20px;height:20px}
.cbtn.alt{background:var(--paper-2);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--hc) 35%,transparent)}
.cbtn.ghost{background:transparent;color:var(--muted);box-shadow:none;min-height:44px;padding:0 10px;font-size:14px}
.cbtn.wide{flex:1;justify-content:center}

/* slots (fruit) */
.slots{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.slot{flex:1;min-width:110px;min-height:104px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--hc) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:14px;color:var(--muted);position:relative}
.slot svg{width:34px;height:34px}
.slot .ph{opacity:.35}
.slot.on{border-style:solid;border-color:var(--hc);background:var(--hc);color:var(--on)}
.slot.just svg{animation:boing .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(.2) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}

/* weekly (movement) */
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.wd .c{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px dashed color-mix(in srgb,var(--hc) 50%,transparent);display:grid;place-items:center;color:var(--on)}
.wd .c svg{width:60%;height:60%}
.wd.on .c{background:var(--hc);border:none}
.wd.today{color:var(--ink)}
.wd.today .c{border-style:solid;border-color:var(--hc)}
.wd.fut{opacity:.6}
.wd.just .c{animation:boing .7s cubic-bezier(.3,1.6,.5,1)}
.track{position:relative;height:16px;border-radius:999px;background:var(--paper-2);margin:16px 0 6px;overflow:visible}
.track .f{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--hc);transition:width .7s cubic-bezier(.3,1.4,.5,1)}
.track .mk{position:absolute;top:-6px;bottom:-6px;width:3px;border-radius:2px;background:var(--ink);opacity:.6}
.tlabels{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);position:relative;height:16px}
.tlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap}

/* counter (generic) */
.counter{display:flex;align-items:center;gap:14px;margin-top:10px}
.ringbox{width:84px;height:84px;position:relative;flex:none}
.ringbox svg{width:84px;height:84px;transform:rotate(-90deg)}
.ringbox .rb{transition:stroke-dashoffset .7s cubic-bezier(.3,1.4,.5,1)}
.counter .mid{flex:1;min-width:0}

/* history */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.monthnav h2{font-size:26px;text-transform:capitalize;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:12px 10px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.03em}
.stat span{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-top:2px;line-height:1.2}
.panel{padding:16px;margin-top:14px}
.panel h2{font-size:20px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wh{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--paper-2);font-weight:900;font-size:14px;display:grid;place-items:center;position:relative;color:var(--ink)}
.cal .d.today{box-shadow:0 0 0 2.5px var(--ink)}
.cal .d.fut{opacity:.35;cursor:default}
.cal .d.hot{color:#1A2142}
.cal .d .mv{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.cal .d .st{position:absolute;top:-6px;right:-5px;width:16px;height:16px;color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;font-size:12px;font-weight:800;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.hrow{--hc:var(--pink)}
.hrow+.hrow{margin-top:16px}
.hrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hrow .top b{font-size:16px;font-weight:900}
.hrow .top span{font-size:12.5px;font-weight:800;color:var(--muted)}
.bars{display:grid;gap:6px;margin-top:8px;align-items:end}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:3px}
.bars .col{width:100%;max-width:30px;height:52px;border-radius:8px 8px 4px 4px;background:var(--paper-2);position:relative;overflow:hidden}
.bars .fill{position:absolute;left:0;right:0;bottom:0;background:var(--hc)}
.bars .fill.part{opacity:.45}
.bars small{font-size:10.5px;font-weight:900;color:var(--muted);text-transform:uppercase}

/* manage */
.mrow{--hc:var(--pink);display:flex;align-items:center;gap:12px;padding:12px 14px}
.mrow .info{flex:1;min-width:0}
.mrow .info b{display:block;font-size:17px;font-weight:900;overflow-wrap:anywhere}
.mrow .info span{font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--hc:var(--green);min-height:42px;padding:0 14px;border-radius:999px;background:var(--paper);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;border:2px solid color-mix(in srgb,var(--hc) 60%,transparent)}
.chip svg{width:18px;height:18px;color:var(--hc)}
.tip{font-size:14px;font-weight:700;color:var(--muted)}
.tip p{margin:0 0 8px}.tip p:last-child{margin:0}
.tip b{color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800}
.sw{width:56px;height:32px;border-radius:999px;background:var(--paper-2);position:relative;flex:none;border:2px solid var(--edge)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:#fff}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
nav.tabs button{min-height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:800;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}

/* sheet + modal */
.overlay{position:fixed;inset:0;background:rgba(10,24,30,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:26px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{min-height:50px;border-radius:14px;border:2px solid color-mix(in srgb,var(--edge) 50%,transparent);background:var(--paper-2);color:var(--ink);padding:0 14px;font:inherit;font-weight:800;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:14px;background:var(--paper-2);font-weight:900}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.picker button{width:48px;height:48px;border-radius:14px;background:var(--paper-2);display:grid;place-items:center}
.picker button svg{width:24px;height:24px}
.picker button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.picker .dotc{width:30px;height:30px;border-radius:50%;background:var(--hc)}
.actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.actions .cbtn{flex:1;justify-content:center}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:45;transform:translate(-50%,-140%);padding:12px 20px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.toast.show{transform:translate(-50%,0)}
.toast:not(.show){transform:translate(-50%,-200%);visibility:hidden;transition:transform .5s cubic-bezier(.3,1.6,.5,1),visibility 0s .5s}
.party{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(10,24,30,.45);padding:20px}
.party .box{max-width:380px;width:100%;text-align:center;padding:26px 22px 22px;animation:in .6s cubic-bezier(.3,1.6,.5,1)}
.party .sun{width:110px;height:110px;margin:-64px auto 6px;display:block;animation:spin 14s linear infinite}
.party h2{font-size:44px;letter-spacing:-.04em}
.party h2 em{font-style:normal;color:var(--pink)}
.party p{font-weight:600;margin:8px 0 18px}
@keyframes in{from{transform:scale(.4) rotate(-10deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.025)}}
.skel{height:150px;opacity:.7}

/* ---- colour-block skin ---- */
#bg{display:none}
.paper{background-image:none;box-shadow:0 2px 0 rgba(66,47,14,.12),0 14px 30px -14px rgba(60,35,0,.55)}
.dayhead h1,.monthnav h2{color:var(--ink)}
.dayhead .sub{color:var(--ink);opacity:.75}
.round{background:var(--ink);color:var(--cream)}
.hero{background:var(--ink);color:var(--corn)}
.hero p small{color:color-mix(in srgb,var(--cream) 70%,transparent)}
.hero .meter svg circle:first-child{stroke:color-mix(in srgb,var(--cream) 15%,transparent)}
.hero.done{background:var(--pink);color:var(--corn)}
.hero.done p small{color:var(--cream);opacity:.85}
.banner{background:var(--ink);color:var(--cream)}
.card{--hf:#F7E9B2;--cream:var(--hf);background:var(--hc);color:var(--hf);--ink:var(--hf);--muted:color-mix(in srgb,var(--hf) 80%,transparent);--paper-2:color-mix(in srgb,var(--hf) 18%,transparent)}
.card[style*="--sky"]{--hf:#F7E9B2}.card[style*="--orange"]{--hf:#1F2A44}.card[style*="--pink"]{--hf:#FDF6E3}.card[style*="--violet"]{--hf:#422F0E}.card[style*="--green"]{--hf:#037F71}
.card h3,.card .big,.card .big small{color:var(--cream)}
.card .big small{opacity:.85}
.card .badge{background:var(--cream);color:var(--hc)}
.card .streak{color:var(--cream)}
.card .streak.zero{color:color-mix(in srgb,var(--cream) 72%,transparent)}
.card .done-tag{background:var(--cream);color:var(--hc)}
.card .cbtn{background:var(--cream);color:var(--hc);box-shadow:0 4px 0 rgba(66,47,14,.28)}
.card .cbtn:active{box-shadow:0 1px 0 rgba(66,47,14,.28)}
.card .cbtn.ghost{background:transparent;color:var(--cream);box-shadow:none}
.card .wd{color:color-mix(in srgb,var(--cream) 85%,transparent)}
.card .wd.today{color:var(--cream)}
.card .wd .c{border-color:color-mix(in srgb,var(--cream) 60%,transparent)}
.card .wd.today .c{border-color:var(--cream)}
.card .wd.on .c{background:var(--cream);color:var(--hc)}
.card .track .f{background:var(--cream)}
.card .track .mk{background:var(--cream);opacity:.8}
.card .slot{border-color:color-mix(in srgb,var(--cream) 50%,transparent);color:color-mix(in srgb,var(--cream) 85%,transparent)}
.card .slot .ph{color:var(--cream)!important}
.card .slot.on{background:var(--cream);border-color:var(--cream);color:var(--hc)}
.card .glass .wv{fill:#AECFD0}
.card .glass .wv2{fill:#FFFFFF;opacity:.6}
.card .glass>rect{fill:#EA5E86}
.card .ringbox svg circle:first-child{stroke:color-mix(in srgb,var(--cream) 18%,transparent)}
.card .ringbox .rb{stroke:var(--cream)}
.stat b{color:inherit}
nav.tabs .in{background:var(--ink)}
nav.tabs button{color:color-mix(in srgb,var(--cream) 65%,transparent)}
nav.tabs button[aria-current="page"]{background:var(--chart);color:var(--ink)}
.toast{background:var(--ink);color:var(--cream)}
.party .box{background:var(--cream)}
.mrow .badge,.chip svg{color:var(--cream)}
.mrow .badge{background:var(--hc)}
.chip svg{color:var(--hc)}
.sw[aria-checked="true"]{background:var(--green)}
.cal .d.hot{color:var(--ink)}

/* ---- celebrating character ---- */
@keyframes chJump{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(2px) scaleY(.97)}50%{transform:translateY(-16px) scaleY(1.02)}}
@keyframes chArmL{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes chArmR{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes chHair{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes chBurst{from{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.08)}to{transform:rotate(360deg) scale(1)}}

/* ---- decorative patterns (risograph-vase inspired) ---- */
.card{overflow:hidden}
.card>*{position:relative;z-index:1}
.card .art{position:absolute;top:-6px;right:-8px;width:100px;height:84px;z-index:0;pointer-events:none}
.card .head .nm{padding-right:72px}
.card .subrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.card .done-tag{padding:3px 9px}
.mrow .badge,.chip{position:relative}

/* ---- reacting portrait ---- */
#cel{position:fixed;inset:0;z-index:38;pointer-events:none}
#cel[hidden]{display:none!important}
#cel .pt{position:absolute;width:150px;height:150px;filter:drop-shadow(0 10px 18px rgba(66,47,14,.35))}
#cel .pt svg{width:100%;height:100%;display:block;overflow:visible}
#cel .bub{position:absolute;padding:8px 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(66,47,14,.5)}
#cel .bub::after{content:"";position:absolute;right:-6px;bottom:8px;width:14px;height:14px;background:inherit;border-radius:3px;transform:rotate(45deg)}
.party .pt{width:150px;height:150px;margin:-100px auto 4px;display:block}
.party .pt svg{width:100%;height:100%;display:block;overflow:visible}

/* ---- palette: Peônia ---- */
:root[data-pal="peonia"]{--bg:#F8F1E2;--paper:#FFFBF2;--paper-2:#FAD2E1;--ink:#770523;--muted:#8E3A52;--edge:#770523;
  --sky:#D81A67;--pink:#D0D996;--orange:#DD4E28;--green:#770523;--violet:#FAD2E1;--yellow:#D0D996;--blue:#FAD2E1;--lilac:#FAD2E1;--chart:#D0D996;--twilight:#FAD2E1;--corn:#FAD2E1;--cream:#FFFBF2}
:root[data-pal="peonia"] .card[style*="--sky"]{--hf:#FFFBF2}
:root[data-pal="peonia"] .card[style*="--orange"]{--hf:#3A0212}
:root[data-pal="peonia"] .card[style*="--pink"]{--hf:#770523}
:root[data-pal="peonia"] .card[style*="--violet"]{--hf:#770523}
:root[data-pal="peonia"] .card[style*="--green"]{--hf:#FAD2E1}
:root[data-pal="peonia"] .round{color:#FAD2E1}
:root[data-pal="peonia"] nav.tabs button{color:color-mix(in srgb,#FAD2E1 75%,transparent)}
:root[data-pal="peonia"] nav.tabs button[aria-current="page"]{background:#FAD2E1;color:#770523}
:root[data-pal="peonia"] .card .glass .wv{fill:#FAD2E1}
:root[data-pal="peonia"] .card .glass>rect{fill:#D0D996}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{border-radius:16px;padding:10px;background:var(--paper-2);display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:14px;text-align:left;color:var(--ink)}
.pal[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pal .sw5{display:flex;height:28px;border-radius:9px;overflow:hidden}
.pal .sw5 i{flex:1}
.apptitle{text-align:center;padding:6px 0 18px}
.apptitle h1{font-size:clamp(40px,12vw,52px);line-height:1;letter-spacing:-.03em;color:var(--ink);display:inline-block;position:relative}
.apptitle h1::after{content:"";position:absolute;left:8%;right:8%;bottom:-8px;height:8px;border-radius:6px;background:var(--pink);opacity:.85}
.dayhead h1{font-size:30px}

/* ---- extra habit colours ---- */
:root{--shortcake2:#FCC4C0;--peach:#FFD094;--tang:#F49625;--tomato:#EF6545;--olive:#8C8A2C;--plum:#7A3B5E;--navy:#1F2A44;--choc:#422F0E}
.card[style*="--shortcake2"]{--hf:#422F0E}.card[style*="--peach"]{--hf:#422F0E}.card[style*="--tang"]{--hf:#2E2008}.card[style*="--tomato"]{--hf:#2E2008}
.card[style*="--olive"]{--hf:#FDF6E3}.card[style*="--plum"]{--hf:#FCC4C0}.card[style*="--navy"]{--hf:#AECFD0}.card[style*="--choc"]{--hf:#F7E9B2}
:root[data-pal] .card[style*="--blue"]{--hf:#1F2A44}

/* ---- workouts ---- */
.wkchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.wkchip{min-height:38px;padding:0 12px;border-radius:999px;border:2px solid color-mix(in srgb,var(--cream) 45%,transparent);font-weight:700;font-size:13.5px;color:var(--cream);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkchip b{font-weight:900}
.wkchip[aria-pressed="true"]{background:var(--cream);color:var(--hc);border-color:var(--cream)}
.wkbox{margin-top:10px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--cream) 16%,transparent)}
.wkbox .wkt{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.wkbox h4{font-family:var(--display);font-weight:800;font-size:20px;margin:2px 0 6px;letter-spacing:-.02em}
.wkbox ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
.wkbox p{margin:0 0 10px;font-weight:700;font-size:14px}
.wkbox .lnk{text-decoration:underline;font-weight:800}
.wl{font-family:var(--display);font-size:18px;color:var(--hc)}
.wkedit{padding:12px;border-radius:14px;background:var(--paper-2);margin-bottom:10px}
.wkedit .field{margin-bottom:8px}
.field textarea{border-radius:14px;border:2px solid color-mix(in srgb,var(--edge) 30%,transparent);background:var(--paper);color:var(--ink);padding:10px 14px;font:inherit;font-weight:700;width:100%;resize:vertical}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.water{grid-template-columns:84px 1fr}.glass{width:84px;height:110px}.dayhead h1{font-size:38px}}
</style>

const DEFAULTS=[

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]||1);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d);};
const today=()=>ds(new Date());
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d);};
const hashStr=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;};
const WD=['seg','ter','qua','qui','sex','sáb','dom'];
function dayLabel(s){const t=today();if(s===t)return'Hoje';if(s===addDays(t,-1))return'Ontem';return parse(s).toLocaleDateString('pt-BR',{weekday:'long'});}
const daySub=s=>parse(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

/* ---------- state ---------- */
const S={pick:{},habits:null,months:{},mode:'loading',view:'hoje',date:today(),hist:today().slice(0,7),slow:false,just:null};
const prefs={sound:false};try{const p=JSON.parse(localStorage.getItem('cdm-prefs2')||'{}');Object.assign(prefs,p);}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('cdm-prefs2',JSON.stringify(prefs));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(d,id)=>{const m=S.months[d.slice(0,7)];return (m&&m[d]&&m[d][id])||0;};
const daily=()=>(S.habits||[]).filter(h=>h.period!=='week');
const weekly=()=>(S.habits||[]).filter(h=>h.period==='week');
const metDay=(d,h)=>val(d,h.id)>=h.target;
function weekCount(d,h){const m=monday(d);let n=0;for(let i=0;i<7;i++)if(val(addDays(m,i),h.id)>0)n++;return n;}

function streakWeek(h){let m=monday(today());if(weekCount(m,h)<h.target)m=addDays(m,-7);let n=0;while(weekCount(m,h)>=h.target&&n<600){n++;m=addDays(m,-7);}return n;}

function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify({habits:S.habits,months:S.months}));}catch(e){}}
let col=null,connected=false,seeded=false,flushT=null,flushing=false,cfgDirty=false;const dirty=new Set();
function markMonth(k){dirty.add(k);saveCache();clearTimeout(flushT);flushT=setTimeout(flush,700);}
function markCfg(){cfgDirty=true;saveCache();clearTimeout(flushT);flushT=setTimeout(flush,300);}
async function flush(){
  if(!col||flushing)return;flushing=true;
  try{if(cfgDirty){cfgDirty=false;await col.doc('config').set({v:5,habits:S.habits,palette:PALK});}
    for(const k of Array.from(dirty)){dirty.delete(k);await col.doc('m-'+k).set({days:S.months[k]||{}});}}
  catch(e){S.mode='local';render();}
  flushing=false;if(dirty.size||cfgDirty)flushT=setTimeout(flush,700);

function migrate(habits){const old=['agua','exercicio','fruta','movimento','exercicio-fisico','creme','rosto'];return DEFAULTS.map(h=>({...h})).concat((habits||[]).filter(h=>!old.includes(h.id)));}
async function connect(){
  const slowT=setTimeout(()=>{if(!connected){S.slow=true;if(!S.habits)S.habits=DEFAULTS.map(h=>({...h}));if(S.mode==='loading')S.mode='local';render();}},10000);
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<20){await new Promise(r=>setTimeout(r,100));tries++;}
  if(!(window.claude&&window.claude.use)){clearTimeout(slowT);goLocal();return;}
  let db=null,user=null;try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);}catch(e){}
  const uid=user?await user.id():null;
  if(!db||!uid){clearTimeout(slowT);goLocal();return;}
  col=db.collection('data/users/'+uid);
  col.onSnapshot(snap=>{
    let cfg=null;const months={};
    snap.docs.forEach(d=>{const b=d.data()||{};if(d.id==='config')cfg=b;else if(d.id.indexOf('m-')===0)months[d.id.slice(2)]=b.days||{};});
    const def=!snap.metadata.fromCache;
    if(def){connected=true;S.slow=false;clearTimeout(slowT);S.mode='cloud';}
    if(cfg&&Array.isArray(cfg.habits)&&cfg.v===5){if(!cfgDirty){S.habits=cfg.habits;if(cfg.palette&&cfg.palette!==PALK)applyPal(cfg.palette);}}
    else if(def&&!seeded){seeded=true;S.habits=cfg&&cfg.habits?migrate(cfg.habits):(S.habits||DEFAULTS.map(h=>({...h})));markCfg();for(const k in S.months)if(!months[k])dirty.add(k);}
    for(const k in months)if(!dirty.has(k))S.months[k]=months[k];
    saveCache();render();
    if(def&&(dirty.size||cfgDirty))flush();
  },()=>{clearTimeout(slowT);goLocal();});
}
function goLocal(){S.mode='local';if(!S.habits)S.habits=DEFAULTS.map(h=>({...h}));render();}

  if(!S.habits.length)return h+'<div class="paper panel" style="text-align:center"><h2>Nenhum hábito ainda</h2><button class="cbtn" data-act="tab" data-v="habitos">Adicionar hábito</button></div>';
  h+='<div class="list">';
  for(const x of S.habits)h+=x.period==='week'?(x.target===1&&(x.ideal||1)===1?onceCard(x,d):weekCard(x,d)):isWater(x)?waterCard(x,d):(x.target===1&&(x.step||1)===1)?stripCard(x,d):isSlots(x)?slotsCard(x,d):counterCard(x,d);
  h+='</div>';
  if(d!==t)h+='<div style="text-align:center;margin-top:16px"><button class="cbtn alt" style="--hc:var(--pink)" data-act="gotoday">Voltar para hoje</button></div>';
  return h;
}
function viewHist(){
  if(!S.habits)return '<p>Carregando…</p>';
  const ym=S.hist,first=parse(ym+'-01'),t=today(),days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const dl=daily(),n=dl.length,wk=weekly();
  let perf=0,sum=0,poss=0,moves=0;
  for(let i=1;i<=days;i++){const d=ym+'-'+pad(i);if(d>t)break;poss+=n;const c=dl.filter(h=>metDay(d,h)).length;sum+=c;if(n&&c===n)perf++;if(wk.some(h=>val(d,h.id)>0))moves++;}
  let h='<div class="dayhead"><div class="t"><h1>Histórico</h1><div class="sub">Sua evolução, dia após dia</div></div></div>';
  h+='<div class="monthnav"><button class="round" data-act="hprev" aria-label="Mês anterior">'+svg(UI.left,2.6)+'</button><h2>'+esc(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))+'</h2><button class="round" data-act="hnext" aria-label="Próximo mês" '+(ym>=t.slice(0,7)?'disabled':'')+'>'+svg(UI.right,2.6)+'</button></div>';
  h+='<div class="stats"><div class="stat paper"><b class="num" style="color:var(--pink)">'+perf+'</b><span>dias completos</span></div><div class="stat paper"><b class="num" style="color:var(--sky)">'+(poss?Math.round(sum/poss*100):0)+'%</b><span>metas diárias cumpridas</span></div><div class="stat paper"><b class="num" style="color:var(--orange)">'+moves+'</b><span>dias com exercício</span></div></div>';
  h+='<div class="panel paper"><div class="cal">'+['S','T','Q','Q','S','S','D'].map(w=>'<div class="wh">'+w+'</div>').join('');
  for(let i=0;i<(first.getDay()+6)%7;i++)h+='<div></div>';
  for(let i=1;i<=days;i++){const d=ym+'-'+pad(i),fut=d>t,c=n?dl.filter(x=>metDay(d,x)).length/n:0,mv=wk.some(x=>val(d,x.id)>0);
    const bgc=fut||c===0?'var(--paper-2)':c===1?'var(--yellow)':'color-mix(in srgb,var(--green) '+Math.round(30+c*50)+'%,var(--paper-2))';
    h+='<button class="d'+(d===t?' today':'')+(fut?' fut':'')+(c===1&&!fut?' hot':'')+'" style="background:'+bgc+'" '+(fut?'disabled':'data-act="openday" data-d="'+d+'"')+' aria-label="Dia '+i+', '+Math.round(c*100)+'% das metas'+(mv?', fez exercício':'')+'">'+i+(mv?'<span class="mv"></span>':'')+(c===1&&!fut?'<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M4 7.5l16 9M20 7.5l-16 9" stroke="var(--pink)" stroke-width="3.4" stroke-linecap="round"/></svg>':'')+'</button>';}
  h+='</div><div class="legend"><span><i style="background:color-mix(in srgb,var(--green) 55%,var(--paper-2))"></i>parte das metas</span><span><i style="background:var(--yellow)"></i>dia completo</span><span><i style="background:var(--orange);border-radius:50%"></i>exercício</span></div></div>';
  h+='<div class="panel paper"><h2>Como está indo</h2>';
  for(const x of S.habits){
    if(x.period==='week'){
      const weeks=[];for(let i=5;i>=0;i--)weeks.push(addDays(monday(t),-7*i));const mx=Math.max(x.ideal||x.target,1);
      h+='<div class="hrow" style="--hc:var(--'+x.color+')"><div class="top"><b>'+esc(x.name)+'</b><span>'+streakWeek(x)+' semana(s) seguidas na meta</span></div><div class="bars" style="grid-template-columns:repeat(6,1fr)">'+
        weeks.map(m=>{const c=weekCount(m,x);return '<div class="b"><div class="col"><div class="fill'+(c<x.target?' part':'')+'" style="height:'+Math.min(100,c/mx*100)+'%"></div></div><small class="num">'+c+'</small></div>';}).join('')+'</div></div>';
    }else{
      const last=[];for(let i=6;i>=0;i--)last.push(addDays(t,-i));
      h+='<div class="hrow" style="--hc:var(--'+x.color+')"><div class="top"><b>'+esc(x.name)+'</b><span>'+streakDay(x)+' seguidos · recorde '+bestRun(d=>metDay(d,x))+'</span></div><div class="bars" style="grid-template-columns:repeat(7,1fr)">'+
        last.map(d=>{const p=Math.min(1,val(d,x.id)/x.target);return '<div class="b"><div class="col"><div class="fill'+(p<1?' part':'')+'" style="height:'+Math.round(p*100)+'%"></div></div><small>'+WD[(parse(d).getDay()+6)%7].slice(0,1)+'</small></div>';}).join('')+'</div></div>';
    }
  }
  return h+'</div>';
}
function viewHabitos(){
  if(!S.habits)return '<p>Carregando…</p>';
  let h='<div class="dayhead"><div class="t"><h1>Hábitos</h1><div class="sub">O que você quer cuidar</div></div></div><div class="list">';
  for(const x of S.habits)h+='<div class="mrow paper" style="--hc:var(--'+x.color+')"><div class="badge">'+svg(ICONS[x.icon]||ICONS.check,2.4)+'</div><div class="info"><b>'+esc(x.name)+'</b><span class="num">'+
    (x.period==='week'?'Meta: '+x.target+(x.ideal&&x.ideal>x.target?' a '+x.ideal:'')+' dias por semana':isWater(x)?'Meta: '+fmtMl(x.target)+' por dia':'Meta: '+x.target+' '+esc(x.unit)+' por dia')+'</span></div>'+
    '<button class="round" data-act="edit" data-id="'+esc(x.id)+'" aria-label="Editar '+esc(x.name)+'">'+svg(UI.edit,2.4)+'</button></div>';
  h+='<button class="cbtn wide" style="--hc:var(--pink)" data-act="new">'+svg(UI.plus,3)+'Adicionar hábito</button></div>';
  const have=new Set(S.habits.map(x=>x.name.toLowerCase())),sug=SUGGEST.filter(s=>!have.has(s.name.toLowerCase()));
  if(sug.length)h+='<div class="panel paper"><h2>Ideias de cuidados</h2><div class="chips">'+sug.map(s=>'<button class="chip" style="--hc:var(--'+s.color+')" data-act="sug" data-i="'+SUGGEST.indexOf(s)+'">'+svg(ICONS[s.icon],2.4)+esc(s.name)+'</button>').join('')+'</div></div>';
  h+='<div class="panel paper"><h2>Paleta de cores</h2><div class="pals">'+Object.keys(PALETTES).map(k=>'<button class="pal" data-act="pal" data-v="'+k+'" aria-pressed="'+(PALK===k)+'"><span class="sw5">'+PALETTES[k].sw.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span>'+PALETTES[k].name+'</button>').join('')+'</div></div>';
  h+='<div class="panel paper"><h2>Backup</h2><p class="tip" style="margin:0 0 12px">Guarde uma cópia dos seus registros. Se trocar de celular, é só importar.</p><div class="btns"><button class="cbtn" style="--hc:var(--ink);color:var(--paper)" data-act="export">Exportar backup</button><label class="cbtn alt" style="--hc:var(--ink);cursor:pointer">Importar backup<input id="f-import" type="file" accept="application/json,.json" hidden></label></div></div>';
  h+='<div class="panel paper"><h2>Ter como app no celular</h2><div class="tip"><p><b>iPhone:</b> abra este endereço no Safari, toque em Compartilhar e em “Adicionar à Tela de Início”.</p><p><b>Android:</b> no Chrome, toque nos três pontinhos e em “Adicionar à tela inicial”.</p><p>'+'Seus registros ficam salvos neste celular. Faça um backup de vez em quando.'+'</p></div></div>';
  return h;
}
function render(){
  app.innerHTML='<header class="apptitle"><h1>Cuidado diário</h1></header>'+(S.view==='hoje'?viewHoje():S.view==='historico'?viewHist():viewHabitos());
  const T=[['hoje','Hoje',UI.today],['historico','Histórico',UI.hist],['habitos','Hábitos',UI.list]];
  tabs.innerHTML=T.map(t=>'<button data-act="tab" data-v="'+t[0]+'"'+(S.view===t[0]?' aria-current="page"':'')+'>'+svg(t[2],2.2)+t[1]+'</button>').join('');
  S.just=null;
  const to=app.querySelectorAll('[data-to]');if(to.length)requestAnimationFrame(()=>requestAnimationFrame(()=>to.forEach(el=>{el.style.transform='translateY('+el.dataset.to+'px)';el.removeAttribute('data-to');})));
}

/* ---------- edit sheet ---------- */
let form=null,confirmDel=false;
function openSheet(h,isNew){form=Object.assign({period:'day',icon:'estrela',color:'green',target:1,unit:'vez',step:1},h);form.isNew=isNew;confirmDel=false;drawSheet();}
function drawSheet(){
  if(!form){sheet.innerHTML='';return;}
  const wk=form.period==='week';
  sheet.innerHTML='<div class="overlay" data-act="close"><div class="sheet paper" role="dialog" aria-modal="true" aria-labelledby="sh-t">'+
   '<h2 id="sh-t">'+(form.isNew?'Novo hábito':'Editar hábito')+'</h2>'+
   '<div class="field"><label for="f-name">Nome</label><input id="f-name" value="'+esc(form.name||'')+'" placeholder="Ex.: Meditar" maxlength="30"></div>'+
   '<div class="flabel">Frequência</div><div class="seg"><button type="button" data-act="fper" data-v="day" aria-pressed="'+!wk+'">Todo dia</button><button type="button" data-act="fper" data-v="week" aria-pressed="'+wk+'">Dias por semana</button></div>'+
   (wk?'<div class="grid2"><div class="field"><label for="f-target">Mínimo por semana</label><input id="f-target" type="number" inputmode="numeric" min="1" max="7" value="'+(form.target||3)+'"></div><div class="field"><label for="f-ideal">Ideal por semana</label><input id="f-ideal" type="number" inputmode="numeric" min="1" max="7" value="'+(form.ideal||form.target||5)+'"></div></div>'+workoutFields()
      :'<div class="grid2"><div class="field"><label for="f-target">Meta por dia</label><input id="f-target" type="number" inputmode="numeric" min="1" value="'+(form.target||1)+'"></div><div class="field"><label for="f-unit">Unidade</label><input id="f-unit" value="'+esc(form.unit||'')+'" placeholder="ml, páginas…" maxlength="14"></div></div>'+
       '<div class="field"><label for="f-step">Quanto soma por toque</label><input id="f-step" type="number" inputmode="numeric" min="1" value="'+(form.step||1)+'"></div>')+
   '<div class="flabel">Ícone</div><div class="picker">'+Object.keys(ICONS).map(k=>'<button type="button" data-act="ficon" data-v="'+k+'" aria-label="Ícone '+k+'" aria-pressed="'+(form.icon===k)+'">'+svg(ICONS[k],2.2)+'</button>').join('')+'</div>'+
   '<div class="flabel">Cor</div><div class="picker">'+COLORS.map(c=>'<button type="button" data-act="fcolor" data-v="'+c+'" aria-label="Cor '+c+'" aria-pressed="'+(form.color===c)+'"><span class="dotc" style="--hc:var(--'+c+')"></span></button>').join('')+'</div>'+
   '<div class="actions"><button class="cbtn alt" style="--hc:var(--pink)" data-act="close">Cancelar</button><button class="cbtn" style="--hc:var(--pink)" data-act="save">Salvar</button></div>'+
   (form.isNew?'':'<div class="actions" style="margin-top:12px"><button class="cbtn ghost" style="color:var(--pink)" data-act="del">'+(confirmDel?'Toque de novo para remover':'Remover hábito')+'</button></div><p class="muted" style="font-size:13px;margin:6px 0 0;font-weight:700">O histórico já registrado fica guardado.</p>')+
   '</div></div>';
}
function workoutFields(){const n=Math.min(7,Math.max(1,parseInt(form.ideal,10)||parseInt(form.target,10)||1));if(n<2)return '';const W=form.workouts||[];
  let o='<div class="flabel">Treinos ('+n+', um para cada dia)</div><p class="muted" style="font-size:13px;margin:4px 0 10px;font-weight:600">Escreva um exercício por linha.</p>';
  for(let i=0;i<n;i++){const w=W[i]||{};o+='<div class="wkedit"><div class="field"><label for="f-wn-'+i+'">Treino '+LET(i)+'</label><input id="f-wn-'+i+'" value="'+esc(w.name||'')+'" placeholder="Ex.: Pernas e glúteo" maxlength="30"></div><div class="field"><label for="f-wi-'+i+'">Exercícios</label><textarea id="f-wi-'+i+'" rows="4" placeholder="Agachamento 3x12&#10;Leg press 3x10&#10;Elevação pélvica 3x12">'+esc(w.items||'')+'</textarea></div></div>';}
  return o;}
function readForm(){['name','target','unit','step','ideal'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)form[k]=el.value;});
  if(document.getElementById('f-wn-0')){const W=[];for(let i=0;i<7;i++){const n=document.getElementById('f-wn-'+i);if(!n)break;W.push({name:n.value.trim(),items:document.getElementById('f-wi-'+i).value});}const old=form.workouts||[];form.workouts=W.concat(old.slice(W.length));}}
function saveForm(){
  readForm();const name=String(form.name||'').trim();if(!name){const i=document.getElementById('f-name');i.focus();i.placeholder='Dê um nome ao hábito';return;}
  const wk=form.period==='week',target=Math.max(1,parseInt(form.target,10)||1);
  const h={id:form.id||(name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'h')+'-'+Math.random().toString(36).slice(2,6),
    name,icon:form.icon,color:form.color,period:wk?'week':'day',target:wk?Math.min(7,target):target,unit:wk?'dias':(String(form.unit||'').trim()||'vezes'),step:wk?1:Math.max(1,parseInt(form.step,10)||1)};
  if(wk)h.ideal=Math.min(7,Math.max(h.target,parseInt(form.ideal,10)||h.target));
  if(wk&&h.ideal>1&&form.workouts)h.workouts=form.workouts.slice(0,h.ideal).map((w,i)=>({name:w.name||('Treino '+LET(i)),items:w.items||''}));
  S.habits=form.isNew?S.habits.concat([h]):S.habits.map(x=>x.id===h.id?h:x);form=null;drawSheet();markCfg();render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if((a==='close'||a==='closeparty')&&(b.classList.contains('overlay')||b.classList.contains('party'))&&e.target!==b)return;
  const o=centerOf(b);
  switch(a){
    case 'water':{const h=H(b.dataset.id),v=val(S.date,h.id),st=(h.step&&h.step<h.target)?h.step:500;if(v>=h.target)break;S.just={id:h.id,from:v};change(h,S.date,Math.min(h.target,v+st),o);break;}
    case 'add':{const h=H(b.dataset.id);if(h&&isWater(h)){S.just={id:h.id,from:val(S.date,h.id)};}if(h)change(h,S.date,val(S.date,h.id)+Number(b.dataset.n),o);break;}
    case 'slot':{const h=H(b.dataset.id),i=+b.dataset.i,v=val(S.date,h.id),nv=i>=v?i+1:i;if(nv>v)S.just={id:h.id,i:nv-1};change(h,S.date,nv,o);break;}
    case 'wtoggle':{const h=H(b.dataset.id),d=b.dataset.d,on=val(d,h.id)>0;if(!on)S.just={id:h.id,d};
      const dayEl=document.querySelector('[data-card="'+h.id+'"] .wd[data-d="'+d+'"]');change(h,d,on?0:(hasW(h)&&(h.ideal||h.target)>1?(d===S.date?curW(h,d):nextW(h,d))+1:1),dayEl&&b.classList.contains('cbtn')?centerOf(dayEl):o);break;}
    case 'wpick':{const h=H(b.dataset.id),i=+b.dataset.i;if(val(S.date,h.id)>0)setVal(S.date,h.id,i+1);else S.pick[h.id]=i;render();break;}
    case 'prev':S.date=addDays(S.date,-1);render();break;
    case 'next':if(S.date<today()){S.date=addDays(S.date,1);render();}break;
    case 'gotoday':S.date=today();render();break;
    case 'tab':S.view=b.dataset.v;render();scrollTo(0,0);break;
    case 'hprev':{const d=parse(S.hist+'-01');d.setMonth(d.getMonth()-1);S.hist=ds(d).slice(0,7);render();break;}
    case 'hnext':{const d=parse(S.hist+'-01');d.setMonth(d.getMonth()+1);S.hist=ds(d).slice(0,7);render();break;}
    case 'openday':S.date=b.dataset.d;S.view='hoje';render();scrollTo(0,0);break;
    case 'new':openSheet({},true);break;
    case 'sug':openSheet(SUGGEST[+b.dataset.i],true);break;
    case 'edit':openSheet(H(b.dataset.id),false);break;
    case 'fper':readForm();form.period=b.dataset.v;if(form.period==='week'){form.target=Math.min(7,+form.target||3);}drawSheet();break;
    case 'ficon':readForm();form.icon=b.dataset.v;drawSheet();break;
    case 'fcolor':readForm();form.color=b.dataset.v;drawSheet();break;
    case 'close':form=null;drawSheet();break;
    case 'save':{const n=form.isNew;saveForm();toast(n?'Hábito criado':'Salvo');break;}
    case 'del':if(!confirmDel){readForm();confirmDel=true;drawSheet();}else{const id=form.id;S.habits=S.habits.filter(x=>x.id!==id);form=null;drawSheet();markCfg();render();}break;
    case 'sound':prefs.sound=!prefs.sound;savePrefs();render();if(prefs.sound)sGoal();break;
    case 'pal':applyPal(b.dataset.v);if(S.habits){S.palette=PALK;markCfg();}render();break;
    case 'export':{const data=JSON.stringify({app:'cuidado-diario',v:1,exported:new Date().toISOString(),habits:S.habits,months:S.months,palette:PALK},null,1);
      const blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuidado-diario-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Backup exportado');break;}
    case 'closeparty':partyEl.innerHTML='';break;
  }
});
document.addEventListener('change',e=>{if(form&&(e.target.id==='f-ideal'||e.target.id==='f-target')){readForm();drawSheet();}});
document.addEventListener('change',e=>{if(e.target.id!=='f-import')return;const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.habits)||typeof j.months!=='object')throw 0;S.habits=j.habits;S.months=j.months||{};if(j.palette)applyPal(j.palette);saveCache();render();toast('Backup importado');}catch(err){toast('Esse arquivo não é um backup válido');}};r.readAsText(f);e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(form){form=null;drawSheet();}partyEl.innerHTML='';}});
let lastToday=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=today();if(t!==lastToday){if(S.date===lastToday)S.date=t;lastToday=t;render();}}});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{sizeFx();if(innerWidth!==bgW)paintBg();},150);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{paintBg();});
new MutationObserver(()=>paintBg()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

applyPal(PALK);loadCache();paintBg();sizeFx();goLocal();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
})();
</script>
